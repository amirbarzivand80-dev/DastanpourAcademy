{% extends 'core/base.html' %}
{% load static %}
{% block title %}
تأیید شماره موبایل
{% endblock %}

{% block content %}

<div class="verify-page">

    <div class="verify-card">

        <h2>تأیید شماره موبایل</h2>

        <p>
            کد ارسال شده به {{ phone }} را وارد کنید.
        </p>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="code"
                maxlength="6"
                placeholder="کد تأیید"
                required
            >

            <button type="submit">
                تأیید
            </button>
        </form>

    </div>

</div>

{% endblock %}
