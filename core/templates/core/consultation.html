{% extends 'core/base.html' %}
{% load static %}

{% block title %}
درخواست مشاوره | آکادمی احمد داستانپور
{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/consultation.css' %}">

<section class="consultation-page">

    <div class="container">

        <div class="consultation-header">

            <span>FREE CONSULTATION</span>

            <h1>
                درخواست مشاوره
            </h1>

            <p>
                برای دریافت مشاوره رایگان و اطلاعات بیشتر درباره دوره‌های آموزشی،
                مشخصات خود را وارد کنید.
            </p>

        </div>

        <div class="consultation-form-wrapper">

            <form method="POST" class="consultation-form">

                {% csrf_token %}

                <div class="form-group">

                    <label for="full_name">
                        نام و نام خانوادگی
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">
                        شماره موبایل
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09xxxxxxxxx"
                        dir="ltr"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="subject">
                        موضوع مشاوره
                    </label>

                    <select
                        id="subject"
                        name="subject"
                        required
                    >

                        <option value="">
                            موضوع موردنظر را انتخاب کنید
                        </option>

                        <option value="education">
                            مشاوره درباره دوره‌های آموزشی
                        </option>

                        <option value="registration">
                            ثبت‌نام در دوره
                        </option>

                        <option value="career">
                            مشاوره ورود به بازار کار
                        </option>

                        <option value="other">
                            سایر موارد
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="message">
                        توضیحات
                        <span>(اختیاری)</span>
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="اگر توضیح یا سوال خاصی دارید اینجا بنویسید..."
                    ></textarea>

                </div>

                <button
                    type="submit"
                    class="consultation-submit"
                >

                    ارسال درخواست مشاوره

                    <i class="fa-solid fa-arrow-left"></i>

                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
