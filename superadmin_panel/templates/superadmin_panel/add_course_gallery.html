{% extends "superadmin_panel/base.html" %}

{% block title %}
افزودن تصویر
{% endblock %}

{% block content %}

<h2>افزودن تصویر</h2>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    <label>انتخاب تصویر</label>

    <input
        type="file"
        name="image"
        accept="image/*"
        required>

    <br><br>

    <button type="submit">

        ذخیره

    </button>

</form>

{% endblock %}
